name: Android APK

# Builds the Android app (android/ wraps the web app in docs/app).
# With the ANDROID_KEYSTORE_BASE64 secret set, a push to main also publishes a release
# whose asset is always named toeic-vocab.apk, so this link stays the same:
# https://github.com/hoya-chen/toeic-learning/releases/latest/download/toeic-vocab.apk

on:
  push:
    branches: [main, 'claude/**']
    paths: ['docs/app/**', 'android/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Decode signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/toeic.p12"
            echo "TOEIC_KEYSTORE=$RUNNER_TEMP/toeic.p12" >> "$GITHUB_ENV"
            echo "SIGNED=1" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set; building a test APK with a throwaway debug key (no release)."
          fi

      - name: Build APK
        working-directory: android
        env:
          TOEIC_VERSION_CODE: ${{ github.run_number }}
          TOEIC_VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          gradle --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/toeic-vocab.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: toeic-vocab-apk
          path: toeic-vocab.apk

      - name: Publish release
        if: github.ref == 'refs/heads/main' && env.SIGNED == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" toeic-vocab.apk \
            --title "TOEIC 單字 App 1.0.${{ github.run_number }}" \
            --notes "Android 手機下載 toeic-vocab.apk 安裝。第一次安裝要允許「安裝不明來源的應用程式」。更新時直接安裝新版，學習進度會保留。" \
            --latest
